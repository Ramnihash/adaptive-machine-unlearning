# Central experiment configuration (CP7.1).
# Every run saves a resolved copy of this file next to its results.
experiment:
  name: default
  seed: 42
  stages: [train_theta0]   # train_theta0 | train_theta_star | train_bpr | train_shadow | unlearn | evaluate
  results_dir: experiments/results

data:
  dataset: movielens-1m
  raw_dir: data/ml-1m
  processed_dir: data/processed
  val_ratio: 0.1
  test_ratio: 0.1

model:
  name: lightgcn          # lightgcn | bpr
  embedding_dim: 64
  num_layers: 3
  learning_rate: 0.001
  regularization: 0.0001
  batch_size: 4096
  epochs: 100
  eval_every: 5
  patience: 5             # evaluations without val improvement before stopping

evaluation:
  k: 10
  target_user: 39
  mia_users: 2000         # users sampled to train/test the membership-inference attack
  # Checkpoints to compare. Set path to a theta_0.pt / theta_star.pt / bpr.pt file.
  # forgotten: true for models trained without the target user (θ*, θᵤ).
  checkpoints:
    theta_0:    {path: null, num_layers: 3}
    theta_star: {path: null, num_layers: 3, forgotten: true}
    bpr:        {path: null, num_layers: 0}
    shadow:     {path: null, num_layers: 3}   # from the train_shadow stage
  shadow:
    fraction: 0.1         # share of users removed from the shadow model's training data
    seed: 123

unlearning:
  target_users: []
  thresholds: {low: 0.33, high: 0.66}
  strategies:
    low: gradient_ascent
    medium: localized_update
    high: targeted_retraining
